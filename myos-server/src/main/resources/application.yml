spring:
  application:
    name: myos-server
  datasource:
    # 本地开发默认 5433，不是 5432：这台机器上另有一个项目（personal os）
    # 用 PGlite 占了 127.0.0.1:5432。撞在一起时后端会连进别人的库，
    # 报错信息却是「bad SQL grammar」这种指向 SQL 的假象，极难排查。
    # Docker 场景由 docker-compose 显式传 DB_PORT=5432，不受此处影响。
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:myos}
    username: ${DB_USER:myos}
    password: ${DB_PASSWORD:myos123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

server:
  port: 8080

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.myos: INFO

# AI 网关（对应 PRD §7.3）
# V1 只对接一个模型，OpenAI 兼容协议。
#
# 下面三项是「兜底值」，取值优先级：
#   数据库 app_config（首页「配置 AI 网关」里填的） > 环境变量 > 这里的默认值
# 所以本机开发照旧 export MYOS_AI_API_KEY 即可；多端部署则在界面上填一次，
# 所有设备共享、无需重启后端。明文 Key 只在后端流转，
# GET /api/v1/ai/config 只回脱敏值（sk-123****cdef），绝不下发完整 Key。
myos:
  ai:
    base-url: ${MYOS_AI_BASE_URL:https://api.deepseek.com}
    model: ${MYOS_AI_MODEL:deepseek-chat}
    api-key: ${MYOS_AI_API_KEY:}
