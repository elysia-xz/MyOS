services:
  postgres:
    image: postgres:18.6
    container_name: myos-postgres
    environment:
      POSTGRES_DB: myos
      POSTGRES_USER: myos
      POSTGRES_PASSWORD: myos123
    ports:
      # 发布到 15432：开发机本地的 PostgreSQL 占着 5432（本地开发库在跑），
      # 直接 5432:5432 会端口冲突起不来。容器间 server→postgres 走服务名+5432，
      # 不受影响；只有宿主 psql 连接时要带 -p 15432。
      # 上 VPS 时如无冲突，可改回 "5432:5432"。
      - "15432:5432"
    volumes:
      - myos_pgdata:/var/lib/postgresql/data
      # 执行顺序即文件名字典序：先建基础表 → 再打增量 → 最后灌演示数据
      - ../myos-server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.sql:/docker-entrypoint-initdb.d/02-schema-v1.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.1.sql:/docker-entrypoint-initdb.d/03-schema-v1.1.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.2.sql:/docker-entrypoint-initdb.d/04-schema-v1.2.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.3.sql:/docker-entrypoint-initdb.d/05-schema-v1.3.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.4.sql:/docker-entrypoint-initdb.d/06-schema-v1.4.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.5.sql:/docker-entrypoint-initdb.d/07-schema-v1.5.sql:ro
      - ../myos-server/src/main/resources/db/schema-v1.6.sql:/docker-entrypoint-initdb.d/08-schema-v1.6.sql:ro
      - ../myos-server/src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/09-seed.sql:ro
      - ../myos-server/src/main/resources/db/seed-v1.sql:/docker-entrypoint-initdb.d/10-seed-v1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myos -d myos"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../myos-server
    container_name: myos-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: myos
      DB_USER: myos
      DB_PASSWORD: myos123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../myos-web
    container_name: myos-web
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  myos_pgdata:
